name: Release APK

# Builds a minified, signed release APK and publishes it to a GitHub Release.
#
# Signing uses the committed `release.jks`, so every build — local or CI — is
# signed with the same key and releases can upgrade in place. See the signing
# block in app/build.gradle.kts for why that keystore is in the repo.
#
# To move signing into CI secrets instead, set all four of:
#   WATCHBOX_KEYSTORE_BASE64     - base64 of your .jks  (base64 -i key.jks | pbcopy)
#   WATCHBOX_KEYSTORE_PASSWORD
#   WATCHBOX_KEY_ALIAS
#   WATCHBOX_KEY_PASSWORD
# When present they override the committed keystore. Note that switching keys
# breaks upgrades for anyone who installed a build signed with the old one.
#
# Optional:
#   WATCHBOX_REPO_URL            - overrides the default extension repository

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the build
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      version_name:
        description: 'Version name (e.g. 1.0.0). Blank = use app/build.gradle.kts'
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.WATCHBOX_KEYSTORE_BASE64 }}
      WATCHBOX_REPO_URL: ${{ secrets.WATCHBOX_REPO_URL }}

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version_name }}" ]]; then
            version="${{ inputs.version_name }}"
          else
            version="$(grep -Eo 'WATCHBOX_VERSION_NAME", "[^"]+"' app/build.gradle.kts \
              | head -1 | sed 's/.*, "//; s/"$//')"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not determine a version." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Building version ${version}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Override keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keystore_path="${RUNNER_TEMP}/watchbox-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          if [[ ! -s "${keystore_path}" ]]; then
            echo "Keystore decoded to an empty file; check the secret." >&2
            exit 1
          fi

          for name in WATCHBOX_KEYSTORE_PASSWORD WATCHBOX_KEY_ALIAS WATCHBOX_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "WATCHBOX_KEYSTORE_BASE64 is set but ${name} is missing." >&2
              exit 1
            fi
          done

          {
            echo "WATCHBOX_RELEASE_STORE_FILE=${keystore_path}"
            echo "WATCHBOX_RELEASE_STORE_PASSWORD=${WATCHBOX_KEYSTORE_PASSWORD}"
            echo "WATCHBOX_RELEASE_KEY_ALIAS=${WATCHBOX_KEY_ALIAS}"
            echo "WATCHBOX_RELEASE_KEY_PASSWORD=${WATCHBOX_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

          echo "Using the keystore supplied via secrets."
        env:
          WATCHBOX_KEYSTORE_PASSWORD: ${{ secrets.WATCHBOX_KEYSTORE_PASSWORD }}
          WATCHBOX_KEY_ALIAS: ${{ secrets.WATCHBOX_KEY_ALIAS }}
          WATCHBOX_KEY_PASSWORD: ${{ secrets.WATCHBOX_KEY_PASSWORD }}

      - name: Assemble release
        env:
          WATCHBOX_VERSION_NAME: ${{ steps.version.outputs.version }}
          # Monotonic across runs, which Android requires for upgrades.
          WATCHBOX_VERSION_CODE: ${{ github.run_number }}
        # Both form factors. A phone build and a TV build ship from one release; the
        # updater picks the right one by asset name.
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease --stacktrace

      - name: Verify extension ABI survived minification
        # R8 strips the eu.kanade.tachiyomi tree unless the keep rules hold,
        # and it only shows up in release builds. Fail here, not on a user's
        # device.
        run: |
          # Checked on both: the keep rules are shared, but a flavor-specific
          # manifest or source set could still change what R8 sees.
          for apk in $(find app/build/outputs/apk/mobile app/build/outputs/apk/tv -name '*-release.apk'); do
            echo "== ${apk}"
            python3 tools/verify-release-abi.py "${apk}"
          done

      - name: Verify signature
        run: |
          apks=$(find app/build/outputs/apk/mobile app/build/outputs/apk/tv -name '*-release.apk' | sort)
          if [[ -z "${apks}" ]]; then
            echo "No release APK was produced." >&2
            exit 1
          fi

          # Four now, not two: two form factors times two architectures. FFmpeg ships
          # native libraries per ABI, so the build splits rather than carrying every copy
          # in one APK - see the splits block in app/build.gradle.kts.
          count=$(wc -l <<< "${apks}")
          if [[ "${count}" -ne 4 ]]; then
            echo "::error::Expected 4 release APKs (mobile/tv x arm64-v8a/armeabi-v7a), found ${count}." >&2
            echo "${apks}" >&2
            exit 1
          fi

          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"

          echo "### Signing" >> "${GITHUB_STEP_SUMMARY}"
          for apk in ${apks}; do
            certs="$("${build_tools}/apksigner" verify --print-certs "${apk}")"
            echo "== ${apk}"
            echo "${certs}"

            # A build signed with a per-runner debug key cannot update any other
            # build, so fail loudly rather than shipping a dead-end APK.
            if grep -q 'CN=Android Debug' <<< "${certs}"; then
              echo "::error::${apk} was signed with a debug key; release.jks was not used." >&2
              exit 1
            fi

            {
              echo
              echo "**$(basename "${apk}")**"
              echo '```'
              grep -E 'DN:|SHA-256 digest' <<< "${certs}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Rename APKs
        id: apk
        # The names are load-bearing: UpdateChecker.selectApkAsset matches the TV build on a
        # "-tv" marker and the device's architecture on an "-arm64-v8a" / "-armeabi-v7a"
        # marker, so an asset renamed by hand will send devices the wrong APK.
        #
        # Four outputs now, not two. FFmpeg ships native libraries per architecture, so the
        # build splits by ABI rather than shipping one APK carrying every copy - see the
        # splits block in app/build.gradle.kts.
        run: |
          version="${{ steps.version.outputs.version }}"
          names=()

          for flavor in mobile tv; do
            for abi in arm64-v8a armeabi-v7a; do
              src="$(find "app/build/outputs/apk/${flavor}" -name "*${abi}*-release.apk" | head -1)"

              if [[ -z "${src}" ]]; then
                echo "::error::No ${abi} release APK for ${flavor}." >&2
                exit 1
              fi

              # watchbox-<version>[-tv]-<abi>.apk
              suffix=""
              [[ "${flavor}" == "tv" ]] && suffix="-tv"
              out="watchbox-${version}${suffix}-${abi}.apk"

              mv "${src}" "${out}"
              names+=("${out}")
            done
          done

          # Newline-separated, because the upload step takes a multi-line path list.
          {
            echo "files<<EOF"
            printf '%s\n' "${names[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          ls -lh watchbox-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: watchbox-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.apk.outputs.files }}
          if-no-files-found: error
          retention-days: 90

      - name: Generate release notes
        if: inputs.mode != 'dry-run' || github.ref_type == 'tag'
        run: |
          previous="$(git describe --tags --abbrev=0 --exclude="${{ steps.version.outputs.tag }}" \
            2>/dev/null || true)"

          {
            echo "## WatchBox ${{ steps.version.outputs.version }}"
            echo
            echo "### Changes"
            echo
            if [[ -n "${previous}" ]]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' -20
            fi
          } > release-notes.md

          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        if: inputs.mode == 'draft' || inputs.mode == 'publish' || github.ref_type == 'tag'
        run: |
          args=(
            "${{ steps.version.outputs.tag }}"
            --title "WatchBox ${{ steps.version.outputs.version }}"
            --notes-file release-notes.md
          )

          # Tag pushes target the tag itself; manual runs target the branch.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            args+=(--target "${GITHUB_REF_NAME}")
          fi

          if [[ "${{ inputs.mode }}" == "draft" ]]; then
            args+=(--draft)
          fi

          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists; uploading the APKs to it instead."
            # shellcheck disable=SC2046
            gh release upload "${{ steps.version.outputs.tag }}" \
              watchbox-*.apk --clobber
          else
            gh release create "${args[@]}" watchbox-*.apk
          fi
