name: Release APK

# Builds a minified release APK and publishes it to a GitHub Release.
#
# Signing is optional: if the keystore secrets below are present the APK is
# signed with your upload key, otherwise Gradle falls back to the debug key and
# the workflow labels the artifact accordingly. That keeps `dry-run` usable on a
# fresh clone with no secrets configured.
#
# Required secrets for a real signed build:
#   WATCHBOX_KEYSTORE_BASE64     - base64 of your .jks   (base64 -i key.jks | pbcopy)
#   WATCHBOX_KEYSTORE_PASSWORD   - keystore password
#   WATCHBOX_KEY_ALIAS           - key alias
#   WATCHBOX_KEY_PASSWORD        - key password
# Optional:
#   WATCHBOX_API_BASE_URL        - overrides the default Worker URL
#   TMDB_API_KEY                 - overrides the bundled TMDB key

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the build
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      version_name:
        description: 'Version name (e.g. 1.0.0). Blank = use app/build.gradle.kts'
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.WATCHBOX_KEYSTORE_BASE64 }}
      WATCHBOX_RELEASE_STORE_PASSWORD: ${{ secrets.WATCHBOX_KEYSTORE_PASSWORD }}
      WATCHBOX_RELEASE_KEY_ALIAS: ${{ secrets.WATCHBOX_KEY_ALIAS }}
      WATCHBOX_RELEASE_KEY_PASSWORD: ${{ secrets.WATCHBOX_KEY_PASSWORD }}
      WATCHBOX_API_BASE_URL: ${{ secrets.WATCHBOX_API_BASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version_name }}" ]]; then
            version="${{ inputs.version_name }}"
          else
            version="$(grep -Eo 'WATCHBOX_VERSION_NAME", "[^"]+"' app/build.gradle.kts \
              | head -1 | sed 's/.*, "//; s/"$//')"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not determine a version." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Building version ${version}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        id: signing
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "No keystore secret found — the APK will be debug-signed." >&2
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          keystore_path="${RUNNER_TEMP}/watchbox-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          if [[ ! -s "${keystore_path}" ]]; then
            echo "Keystore decoded to an empty file; check the secret." >&2
            exit 1
          fi

          # Fail fast when the keystore is present but its companion secrets are not.
          for name in WATCHBOX_RELEASE_STORE_PASSWORD WATCHBOX_RELEASE_KEY_ALIAS \
                      WATCHBOX_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Keystore supplied but ${name} is missing." >&2
              exit 1
            fi
          done

          echo "WATCHBOX_RELEASE_STORE_FILE=${keystore_path}" >> "${GITHUB_ENV}"
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Assemble release
        env:
          WATCHBOX_VERSION_NAME: ${{ steps.version.outputs.version }}
          # Monotonic across runs, which Android requires for upgrades.
          WATCHBOX_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)"
          if [[ -z "${src}" ]]; then
            echo "No release APK was produced." >&2
            exit 1
          fi

          suffix=""
          if [[ "${{ steps.signing.outputs.signed }}" != "true" ]]; then
            suffix="-unsigned-debugkey"
          fi

          dest="watchbox-${{ steps.version.outputs.version }}${suffix}.apk"
          mv "${src}" "${dest}"
          echo "path=${dest}" >> "${GITHUB_OUTPUT}"
          ls -lh "${dest}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: watchbox-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Generate release notes
        if: inputs.mode != 'dry-run' || github.ref_type == 'tag'
        run: |
          previous="$(git describe --tags --abbrev=0 --exclude="${{ steps.version.outputs.tag }}" \
            2>/dev/null || true)"

          {
            echo "## WatchBox ${{ steps.version.outputs.version }}"
            echo
            if [[ "${{ steps.signing.outputs.signed }}" != "true" ]]; then
              echo "> **Note:** this build is signed with the debug key."
              echo "> Configure the keystore secrets for a distributable build."
              echo
            fi
            echo "### Changes"
            echo
            if [[ -n "${previous}" ]]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' -20
            fi
          } > release-notes.md

          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        if: inputs.mode == 'draft' || inputs.mode == 'publish' || github.ref_type == 'tag'
        run: |
          args=(
            "${{ steps.version.outputs.tag }}"
            --title "WatchBox ${{ steps.version.outputs.version }}"
            --notes-file release-notes.md
          )

          # Tag pushes target the tag itself; manual runs target the branch.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            args+=(--target "${GITHUB_REF_NAME}")
          fi

          if [[ "${{ inputs.mode }}" == "draft" ]]; then
            args+=(--draft)
          fi

          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists; uploading the APK to it instead."
            gh release upload "${{ steps.version.outputs.tag }}" \
              "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "${args[@]}" "${{ steps.apk.outputs.path }}"
          fi
